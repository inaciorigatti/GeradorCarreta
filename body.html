<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://img.freepik.com/vetores-premium/ilustracao-vetorial-de-veiculo-isolado-de-reboque-de-caminhao-de-desenho-animado_939711-4051.jpg" type="image/png">
  <title>Gerador de Anúncio de Carreta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Gerador de Anúncio de Carreta</h1>

  <label for="titulo">Título</label>
  <input type="text" id="titulo">

  <label for="descricao">Descrição</label>
  <textarea id="descricao" rows="3"></textarea>

  <h3>Especificações Técnicas</h3>
  <label for="marcaModelo">Marca/Modelo</label>
  <input type="text" id="marcaModelo" placeholder="Ex: Randon Graneleira">

  <label for="ano">Ano de Fabricação</label>
  <input type="text" id="ano" placeholder="Ex: 2017">

  <label for="tipo">Tipo</label>
  <input type="text" id="tipo" placeholder="Ex: Graneleira">

  <label for="cor">Cor</label>
  <input type="text" id="cor" placeholder="Ex: Vermelha">

  <label for="eixos">Número de Eixos</label>
  <input type="text" id="eixos" placeholder="Ex: 3 eixos">

  <label for="suspensao">Tipo de Suspensão</label>
  <input type="text" id="suspensao" placeholder="Ex: Pneumática">

  <label for="freios">Freios</label>
  <input type="text" id="freios" placeholder="Ex: ABS / S-cam">

  <label for="capacidade">Capacidade de Carga</label>
  <input type="text" id="capacidade" placeholder="Ex: 35 toneladas">

  <label for="dimensoes">Dimensões</label>
  <input type="text" id="dimensoes" placeholder="Ex: 12,5m x 2,6m x 3,0m">

  <label for="condicao">Condições Gerais</label>
  <textarea id="condicao" rows="3"></textarea>

  <label for="documentacao">Documentação</label>
  <textarea id="documentacao" rows="3"></textarea>

  <h3>Valor e Condições de Pagamento</h3>
  <label for="valor">Valor</label>
  <input type="text" id="valor" placeholder="Ex: R$ 120.000,00">

  <div class="checkboxes">
    <label><input type="checkbox" id="avista"> ✅ Aceita proposta à vista</label>
    <label><input type="checkbox" id="troca"> ✅ Estuda troca</label>
    <label><input type="checkbox" id="financiamento"> ✅ Possibilidade de financiamento via banco parceiro</label>
  </div>

  <input type="hidden" id="contato" value="Luciano 49 99941-0157">

  <button onclick="gerarTexto()">Gerar Anúncio</button>

  <div id="output"></div>

  <script src="script.js"></script>
</body>
</html>
